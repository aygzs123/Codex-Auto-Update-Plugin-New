name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: PowerShell tests and version guard
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version baseline
        id: baseline
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            "base=${{ github.event.pull_request.base.sha }}" >> $env:GITHUB_OUTPUT
          } elseif ("${{ github.event_name }}" -eq "push") {
            "base=${{ github.event.before }}" >> $env:GITHUB_OUTPUT
          } else {
            "base=" >> $env:GITHUB_OUTPUT
          }

      - name: Require plugin version bump
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\Test-PluginVersionBump.ps1 -BaseRef "${{ steps.baseline.outputs.base }}" -HeadRef "${{ github.sha }}"

      - name: Install workflow tests
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install\Install.Tests.ps1

      - name: Plugin updater tests
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File plugins\codex-ms-desktop-updater\tests\CodexStoreUpdater.Tests.ps1

  # 桌面应用单独一个 job，和上面的 PowerShell 测试并行跑。
  # 以前 CI 里完全没有 Node 步骤，desktop/ 下的测试一次都没在 CI 上跑过 ——
  # 只有人记得在本地敲 npm test 时才跑（现在 desktop/tests 下有 15 个 *.test.cjs）。
  desktop:
    name: Desktop updater tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        working-directory: desktop
        run: npm test

      - name: Simulate install pipeline
        working-directory: desktop
        run: npm run verify:simulate
