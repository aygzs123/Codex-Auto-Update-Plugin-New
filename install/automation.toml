version = 1
id = "daily-codex-desktop-update-check"
kind = "cron"
name = "Daily Codex Desktop update install"
prompt = "From {{CODEX_PLUGIN_ROOT}}, execute `powershell -NoProfile -ExecutionPolicy Bypass -File {{CODEX_MAINTENANCE_SCRIPT}} -NoProxy` directly. Do not present the PowerShell command as an instruction to the user. The maintenance script first updates this plugin from GitHub when a newer plugin.json version exists, then checks Codex Desktop and starts the detached install-and-restart workflow when a newer MSIX is available. If it says `No newer package was found`, do not notify the user. If it says `ADMIN_PRIVILEGES_REQUIRED`, this update needs administrator rights, which the unattended run deliberately does not request: the package has already been downloaded and nothing was changed. Tell the user once, plainly, to open the Codex Updater desktop app and click the update button there (it will show a single UAC prompt), and mention the downloaded package path printed by the script."
status = "ACTIVE"
rrule = "FREQ=DAILY;BYHOUR=9;BYMINUTE=0;BYSECOND=0"
model = "gpt-5.4"
reasoning_effort = "medium"
execution_environment = "local"
cwds = ["{{CODEX_PLUGIN_ROOT}}"]
created_at = 1779417045208
updated_at = 1780480643752
