  <title>Codex Updater · 桌面端交互原型</title>

<body>
  <div class="app" id="app">
    <header class="topbar" aria-label="应用标题栏">
      <div class="traffic-lights" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="window-controls" aria-label="窗口控制（原型演示）">
        <button class="window-control min" data-action="window-min" aria-label="最小化" title="最小化"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
        <button class="window-control max" data-action="window-max" aria-label="最大化" title="最大化"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx=".7"/></svg></button>
        <button class="window-control close" data-action="window-close" aria-label="关闭窗口" title="关闭窗口"><svg viewBox="0 0 12 12"><path d="m2 2 8 8m0-8-8 8"/></svg></button>
      </div>
      <div class="row title-brand"><svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/></svg>Codex Updater</div>
      <span class="prototype-label">交互原型</span>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand row"><div class="logo" data-icon="code"></div><div class="brand-text"><strong>Codex Updater</strong><p>DESKTOP COMPANION</p></div></div>
        <div><p class="nav-label">工作台</p><nav class="nav" aria-label="主导航">
          <button data-page="overview" class="active"><span data-icon="grid"></span><span class="nav-text">概览</span></button>
          <button data-page="diagnostics"><span data-icon="pulse"></span><span class="nav-text">诊断</span></button>
          <button data-page="history"><span data-icon="history"></span><span class="nav-text">版本与缓存</span><span class="nav-count" id="nav-count">2</span></button>
          <button data-page="settings"><span data-icon="settings"></span><span class="nav-text">设置</span></button>
        </nav></div>
        <div class="sidebar-bottom">
          <button class="help-link" data-action="help" aria-label="使用帮助"><i data-icon="help"></i><span>使用帮助</span></button>
          <div class="sidebar-status"><div class="row" style="gap:8px"><span class="dot green" id="health-dot"></span><strong style="font-size:11px" id="health-label">运行环境正常</strong></div><p>Windows 11 · x64</p></div>
        </div>
      </aside>
      <main class="main" id="main" tabindex="-1"><div class="content" id="content"></div></main>
    </div>
  </div>
  <footer class="demo-bar" aria-label="原型演示工具">
    <strong>交互演示</strong>
    <label for="scenario" class="muted">场景</label>
    <select id="scenario" aria-label="演示场景">
      <option value="update">发现更新</option><option value="latest">已是最新</option><option value="offline">检查失败</option><option value="not-installed">尚未安装</option><option value="resource">资源异常</option><option value="cache-error">缓存读取失败</option><option value="signature">签名校验失败</option><option value="uac">取消管理员授权</option><option value="move-blocked">不支持应用迁移</option>
    </select>
    <button class="btn" data-action="external-delete">模拟外部删除缓存</button>
    <span class="demo-divider"></span><button class="btn quiet" data-action="reset">重置演示</button><button class="btn quiet" data-action="guide">交互说明</button>
    <span class="demo-note">示例数据 · 不执行真实安装</span>
  </footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="dialog-title"></dialog>
  <div id="paused" class="screen-paused" hidden></div>
  <script>
    // 原型只模拟业务状态，不连接 Electron、磁盘或真实安装服务。
    const ICONS = {
      code:'<path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/>',
      grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
      pulse:'<path d="M2 12h4l3-8 5 16 3-8h5"/>',
      history:'<path d="M3 11a9 9 0 1 1 2.5 7M3 5v6h6m3-4v6l4 2"/>',
      settings:'<path d="m9 3 1-1h4l1 3 3 1 3 1v4l-2 2 1 3-2 3-3-1-2 2h-4l-1-3-3-1-2-2 1-4 2-1V6z"/><circle cx="12" cy="11" r="3"/>',
      help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4m0 3v.1"/>',
      refresh:'<path d="M20 7a9 9 0 0 0-15-2L3 8m0-5v5h5m-4 9a9 9 0 0 0 15 2l2-3m0 5v-5h-5"/>',
      arrow:'<path d="m9 5 7 7-7 7"/>',
      download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/>',
      shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z"/><path d="m8 12 3 3 5-6"/>',
      check:'<path d="m5 12 4 4L19 6"/>',
      clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>',
      box:'<path d="m12 3 9 5v9l-9 5-9-5V8zm-9 5 9 5 9-5m-9 5v9M7 5l10 5v5"/>',
      disk:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 13h18m-4 3h.1m-4 0h.1"/>',
      monitor:'<rect x="3" y="3" width="18" height="13" rx="2"/><path d="M8 21h8m-4-5v5"/>',
      folder:'<path d="M3 7V5h6l2 3h10v12H3z"/>',
      trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>',
      info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>',
      alert:'<path d="m12 3 10 18H2zm0 6v5m0 3v.1"/>',
      close:'<path d="m6 6 12 12M6 18 18 6"/>',
      play:'<path d="m8 4 12 8-12 8z"/>',
      external:'<path d="M14 3h7v7m0-7L10 14M9 3H3v18h18v-6"/>',
      network:'<path d="M3 8a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0m-9 4a5 5 0 0 1 6 0m-3 4v.1"/>',
      copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',
      pin:'<path d="m15 3 6 6-4 1-4 6-2-2-7 7m3-14 6-4zm0 0-3 4 9 9 4-3"/>',
      sun:'<circle cx="12" cy="12" r="4"/><path d="M12 1v2m0 18v2M1 12h2m18 0h2M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/>',
      bell:'<path d="M4 17h16l-2-4V8a6 6 0 0 0-12 0v5zm6 3h4"/>',
      tool:'<path d="M14 5a6 6 0 0 0-7 8l-5 5 4 4 5-5a6 6 0 0 0 8-7l-4 3-4-4z"/>',
    };
    const icon = (name, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ICONS.info}</svg>`;
    const esc = text => String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const CURRENT = '26.1103.4239.0', LATEST = '26.1106.1800.0';
    const STORE_KEY = 'codex-updater-design-preferences-v1';
    const defaults = { theme:'system',autoCheck:true,notify:true,tray:true,startup:false,interval:'24',retention:'0' };
    let preferences = {...defaults}, storageAvailable = true;
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
      for (const key of Object.keys(defaults)) if (typeof saved[key] === typeof defaults[key]) preferences[key] = saved[key];
      if (!['light','dark','system'].includes(preferences.theme)) preferences.theme = 'system';
      if (!['6','12','24'].includes(preferences.interval)) preferences.interval = '24';
      if (!['0','2','3','5'].includes(preferences.retention)) preferences.retention = '0';
    } catch { storageAvailable = false; }
    const seedPackages = () => [
      {id:'current',version:CURRENT,mb:428,date:'2026-11-04',pinned:false},
      {id:'previous',version:'26.1029.3100.0',mb:414,date:'2026-10-30',pinned:true}
    ];
    const seedActivity = () => [
      {icon:'refresh',title:'发现新版本',detail:`${LATEST} · 可下载`,time:'刚刚'},
      {icon:'check',title:'环境检查完成',detail:'5 项资源正常',time:'09:41'},
      {icon:'box',title:'安装完成',detail:CURRENT,time:'11月4日'}
    ];
    const state = {
      page:'overview',tab:'general',scenario:'update',phase:'available',current:CURRENT,
      disk:seedPackages(),cache:seedPackages(),cacheError:false,cacheScanning:false,cacheSynced:'刚刚',
      activity:seedActivity(),progress:0,checked:'刚刚',health:true,diagnosing:false,networkChecked:false,
      installDrive:'C',moveStatus:'unknown',storageBusy:false,repairing:false,directory:'%LOCALAPPDATA%\\Codex Updater\\downloads',maximized:false
    };
    let taskGeneration = 0, cacheGeneration = 0, toastTimer, cacheTimer, dialogCallback;
    const busy = () => state.storageBusy || state.diagnosing || ['checking','downloading','verifying','installing'].includes(state.phase);
    const totalMb = () => state.cache.reduce((sum,pkg) => sum + pkg.mb,0);
    const formatSize = mb => mb >= 1024 ? `${(mb/1024).toFixed(2)} GB` : `${mb} MB`;
    const packageCount = () => state.cacheError ? '—' : state.cache.length;
    const cacheSize = () => state.cacheError ? '读取失败' : formatSize(totalMb());
    const badge = (text,tone='green') => `<span class="badge ${tone}"><span class="dot"></span>${text}</span>`;
    const button = (text,action,ico='',cls='',disabled=false) => `<button class="btn ${cls}" data-action="${action}" ${disabled?'disabled':''}>${ico?icon(ico):''}${text}</button>`;
    function record(title,detail='',type='check') { state.activity.unshift({title,detail,icon:type,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}); state.activity = state.activity.slice(0,15); }
    function toast(message) {
      const el = document.querySelector('#toast');
      el.innerHTML = `${icon('check')}<span>${esc(message)}</span>`; el.classList.add('visible');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('visible'),3500);
    }
    function savePreferences() {
      try { localStorage.setItem(STORE_KEY,JSON.stringify(preferences)); storageAvailable = true; }
      catch { storageAvailable = false; toast('浏览器无法保存设置，本次会话内仍然生效'); }
    }
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme() { document.documentElement.dataset.theme = preferences.theme === 'system' ? (media.matches?'dark':'light') : preferences.theme; }
    media.addEventListener('change', () => { if (preferences.theme === 'system') applyTheme(); });
    function showDialog({title,body,confirm='确定',danger=false,action=null,symbol='info'}) {
      const modal = document.querySelector('#modal');
      dialogCallback = action;
      modal.innerHTML = `<button class="dialog-close" data-action="dismiss" aria-label="关闭对话框">${icon('close')}</button><div class="dialog-body"><div class="dialog-symbol ${danger?'warn':''}">${icon(symbol)}</div><h2 id="dialog-title">${title}</h2>${body}</div><div class="dialog-footer">${action?'<button class="btn" data-action="dismiss" autofocus>取消</button>':''}<button class="btn ${danger?'danger-solid':'primary'}" data-action="confirm-dialog" ${action?'':'autofocus'}>${confirm}</button></div>`;
      if (!modal.open) modal.showModal();
    }
    function closeDialog() { document.querySelector('#modal').close(); dialogCallback = null; }
    function heroContent() {
      const map = {
        available:['发现新版本','下载更新，准备好后再安装。'],
        unchecked:['检查 Codex 更新','查看是否有可用的新版本。'],
        checking:['正在检查更新','正在连接 Microsoft Store 分发源…'],
        latest:['Codex 已是最新','当前版本可继续使用。'],
        downloading:['正在下载更新','你可以继续使用 Codex。'],
        verifying:['正在校验安装包','检查完整性与发布者签名。'],
        ready:['更新已准备好','安装前请保存正在进行的工作。'],
        installing:['正在安装更新','安装完成后将自动启动 Codex。'],
        success:['更新完成','Codex 已启动，可以继续工作。'],
        error:['暂时无法检查更新','连接失败，请检查网络后重试。'],
        'not-installed':['安装 Codex Desktop','下载并安装 Microsoft Store 安装包。'],
        'signature-error':['安装包校验未通过','已阻止安装，请重新下载安装包。']
      };
      return map[state.phase] || map.unchecked;
    }
    function heroActions() {
      switch(state.phase) {
        case 'checking': return button('检查中','none','refresh','primary',true);
        case 'downloading': return button('取消下载','cancel-download','','');
        case 'verifying': return button('校验中','none','shield','primary',true);
        case 'installing': return button('安装中','none','refresh','primary',true);
        case 'ready': return button('安装并重启 Codex','install','download','primary')+button('稍后安装','later');
        case 'latest': case 'success': return button('启动 Codex','launch','play','primary')+button('检查更新','check','refresh');
        case 'error': return button('重试检查','check','refresh','primary')+button('网络诊断','network','network');
        case 'signature-error': return button('重新下载','download','download','primary')+button('查看详情','signature-detail');
        case 'not-installed': return button('下载安装包','download','download','primary')+button('安装说明','install-info');
        case 'unchecked': return button('检查更新','check','refresh','primary');
        default: return button('下载更新','download','download','primary')+button('检查更新','check','refresh');
      }
    }
    function overview() {
      const [title,description] = heroContent();
      const hasLatest = !['unchecked','checking','error'].includes(state.phase);
      const target = state.phase === 'latest' ? state.current : LATEST;
      const versionBadge = state.phase === 'latest' || state.phase === 'success' ? badge('已是最新') : hasLatest ? badge('有可用更新','blue') : badge('待检查','');
      return `<div class="page-head"><div><h1>概览</h1><p>Codex 的更新与运行状态</p></div><span class="badge">${icon('monitor')} Windows · x64</span></div>
        ${!state.health?`<div class="notice amber">${icon('alert')}<div class="grow"><strong>检测到 1 项资源异常</strong><p>可能影响 Codex 启动，建议先修复。</p></div>${button('查看诊断','diagnostics','','')}</div>`:''}
        <section class="card hero" aria-label="Codex 更新状态">
          <div class="hero-main"><div>
            <div class="row app-caption"><div class="logo">${icon('code')}</div><div><strong>Codex Desktop</strong><small>Microsoft Store 分发版</small></div></div>
            <h2>${title}</h2><p class="hero-description">${description}</p>
            ${['downloading','verifying','installing'].includes(state.phase)?`<div class="progress-block"><div class="row between"><small class="sub">${state.phase==='downloading'?`${Math.round(436*state.progress/100)} / 436 MB`:state.phase==='verifying'?'签名校验':'正在部署应用'}</small><small class="mono blue">${state.progress}%</small></div><div class="progress-track" role="progressbar" aria-label="更新进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${state.progress}"><span style="width:${state.progress}%"></span></div></div>`:''}
            <div class="hero-actions">${heroActions()}</div>
          </div><div class="version-compare"><div class="row between version-caption"><span>版本状态</span>${versionBadge}</div>
            <div class="version-step"><span class="version-node"></span><div><small>当前版本</small><strong class="mono">${state.current||'尚未安装'}</strong></div></div>
            <div class="version-step latest"><span class="version-node"></span><div><small>可用版本</small><strong class="mono ${hasLatest?'blue':'sub'}">${hasLatest?target:'等待检查'}</strong></div></div>
            <div class="row between version-size"><span>${hasLatest?'稳定版 · x64':'连接后显示版本'}</span><span>${hasLatest?'436 MB':'—'}</span></div>
          </div></div>
          <div class="hero-foot"><span class="row" style="gap:6px">${icon('shield')} 安装前校验签名</span><span class="row source-label" style="gap:6px">${icon('box')} Microsoft Store</span><span class="row" style="gap:6px">${icon('clock')} 上次检查：${state.checked}</span></div>
        </section>
        <section class="card stat-strip" aria-label="本机信息">
          <button class="stat-item" data-action="installed-info"><span class="tile-icon">${icon('monitor')}</span><span class="grow"><small>安装位置</small><strong>${state.current?`${state.installDrive} 盘 · WindowsApps`:'尚未安装'}</strong></span>${icon('arrow','chevron')}</button>
          <button class="stat-item" data-page="history"><span class="tile-icon">${icon('disk')}</span><span class="grow"><small>安装包缓存</small><strong>${state.cacheError?'读取失败':`${cacheSize()} <span class="muted">/ ${packageCount()} 个</span>`}</strong></span>${icon('arrow','chevron')}</button>
          <button class="stat-item" data-action="auto-settings"><span class="tile-icon">${icon('refresh')}</span><span class="grow"><small>自动检查</small><strong>${preferences.autoCheck?`每 ${preferences.interval} 小时`:'已关闭'}</strong></span>${icon('arrow','chevron')}</button>

        if (changed) { record('缓存已同步',`${state.cache.length} 个安装包 · ${cacheSize()}`,'disk'); toast(`缓存已同步：${state.cache.length} 个安装包`); }
        else if (notify) toast('缓存已是最新状态');
        if(state.phase==='ready'&&!state.disk.some(pkg=>pkg.version===LATEST)) state.phase='available';
      }
      render();
    }
    // 模拟目录事件与窗口激活共用扫描入口；实际文件监听由桌面主进程接入。
    window.addEventListener('prototype-cache-change',()=>{clearTimeout(cacheTimer);cacheTimer=setTimeout(()=>void scanCache(false),240);});
    window.addEventListener('focus',()=>{if(!busy()) void scanCache(false);});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy()) void scanCache(false);});
    async function checkUpdate() {
      if(busy()) return;
      const generation = ++taskGeneration;
      state.phase = 'checking'; render(); await delay(1300);
      if(generation!==taskGeneration) return;
      state.checked = '刚刚';
      state.phase = state.scenario==='offline'?'error':state.current===LATEST||state.scenario==='latest'?'latest':state.disk.some(pkg=>pkg.version===LATEST)?'ready':state.current?'available':'not-installed';
      record(state.phase==='error'?'检查更新失败':state.phase==='latest'?'已是最新版本':'发现新版本',state.phase==='error'?'连接超时，可重试':state.phase==='latest'?state.current:LATEST,state.phase==='error'?'alert':'refresh');
      render(); toast(state.phase==='error'?'检查失败，可在诊断页检查网络':state.phase==='latest'?'当前已是最新版本':'检查完成，有可用更新');
    }
    async function download() {
      if(busy()) return;
      const generation = ++taskGeneration;
      state.phase = 'downloading';state.progress=0;render();
      for(let n=7;n<=100;n+=7) { await delay(210); if(generation!==taskGeneration)return;state.progress=Math.min(n,100);renderProgress(); }
      state.progress=100;state.phase='verifying';render();await delay(950);
      if(generation!==taskGeneration)return;
      if(state.scenario==='signature') {
        state.phase='signature-error';record('安装包校验失败','已阻止安装，不允许跳过校验','alert');render();toast('签名校验失败，安装已阻止');return;
      }
      state.disk = [{id:'latest',version:LATEST,mb:436,date:'2026-11-10',pinned:false},...state.disk.filter(pkg=>pkg.version!==LATEST)];
      state.cache=state.disk.map(pkg=>({...pkg}));state.cacheError=false;state.cacheSynced='刚刚';state.phase='ready';
      record('安装包已准备好',`${LATEST} · 签名校验通过`,'shield');render();toast('下载完成，准备好后即可安装');
    }
    function requestInstall(pkg) {
      if(busy())return;
      const target = pkg || state.disk.find(item=>item.version===LATEST);
      if(!target) { state.phase='available';void scanCache(false);toast('安装包已不存在，请重新下载');return; }
      const rollback = target.version!==LATEST && target.version!==state.current;
      showDialog({title:rollback?'回退到此版本？':target.version===state.current?'重新安装 Codex？':'安装更新并重启 Codex？',symbol:'download',confirm:rollback?'确认回退':'安装并重启',action:()=>void install(target),body:`<p>请先保存 Codex 中正在进行的工作。</p><div class="detail-box"><div class="row between"><span class="sub">目标版本</span><strong class="mono">${target.version}</strong></div><p style="margin-top:10px">安装时会关闭 Codex，完成后自动启动。</p><p>此示例安装包需要管理员权限，正式应用会弹出一次 Windows 授权窗口。</p></div><p style="margin-top:15px">本原型仅演示流程，不关闭应用或请求系统授权。</p>`});
    }
    async function install(target) {
      if(!state.disk.some(pkg=>pkg.id===target.id)) { void scanCache(false);toast('安装包已被删除，请重新下载');return; }
      if(state.scenario==='uac') { state.phase='ready';record('安装已取消','未获得管理员授权，安装包已保留','info');render();toast('授权已取消，安装包已保留，可再次安装');return; }
      const generation=++taskGeneration;
      state.phase='verifying';state.progress=0;render();await delay(600);
      if(generation!==taskGeneration)return;
      if(state.scenario==='signature') {state.phase='signature-error';record('安装包校验失败','回退与重装也必须校验签名','alert');render();return;}
      state.phase='installing';render();
      for(let n=10;n<=100;n+=10) {await delay(230);if(generation!==taskGeneration)return;state.progress=n;renderProgress();}
      state.current=target.version;state.phase=target.version===LATEST?'success':'available';state.health=true;
      if(Number(preferences.retention)>0) {
        const kept=state.disk.filter(pkg=>!pkg.pinned).slice(0,Number(preferences.retention)).map(pkg=>pkg.id);
        state.disk=state.disk.filter(pkg=>pkg.pinned||kept.includes(pkg.id)||pkg.id===target.id);
      }
      state.cache=state.disk.map(pkg=>({...pkg}));state.cacheSynced='刚刚';
      record('安装完成',`${target.version} · Codex 已启动（演示）`,'check');render();toast('安装完成，Codex 已重新启动（演示）');
    }
    async function diagnose(repair=false) {
      if(busy()||state.diagnosing||!state.current)return;
      state.diagnosing=true;state.repairing=repair;const generation=++taskGeneration;render();await delay(1200);
      if(generation!==taskGeneration)return;
      state.diagnosing=false;state.repairing=false;if(repair)state.health=true;
      record(repair?'资源修复完成':'环境检查完成',state.health?'5 项资源正常':'1 项资源缺失',state.health?'check':'alert');render();toast(state.health?'5 项启动资源正常':'检测到 1 项资源异常');
    }
    function clearCache() {
      if(busy()||state.cacheError)return;
      const removable=state.disk.filter(pkg=>!pkg.pinned);
      if(!removable.length) {toast('所有安装包都已保留，请先取消保留');return;}
      const pinned=state.disk.length-removable.length;
      showDialog({title:'清理安装包缓存？',symbol:'trash',danger:true,confirm:'确认清理',body:`<p>将删除 ${removable.length} 个安装包，释放 ${formatSize(removable.reduce((n,p)=>n+p.mb,0))}。</p><div class="detail-box"><p>已安装的 Codex 不受影响。</p><p>${pinned?`${pinned} 个已保留版本将跳过。`:'删除后无法使用这些安装包回退。'}</p></div>`,action:()=>{state.disk=state.disk.filter(pkg=>pkg.pinned);record('缓存清理完成',`清理 ${removable.length} 个安装包`,'trash');void scanCache(false);}});
    }
    function deletePackage(pkg) {
      if(busy()||!pkg)return;
      showDialog({title:'删除此安装包？',symbol:'trash',danger:true,confirm:'删除安装包',body:`<p class="mono">${pkg.version} · ${pkg.mb} MB</p><div class="detail-box"><p>不影响已安装的 Codex；删除后无法使用此包重装或回退。</p>${pkg.pinned?'<p>此版本已标记为保留，本次删除会同时取消保留。</p>':''}</div>`,action:()=>{state.disk=state.disk.filter(item=>item.id!==pkg.id);record('安装包已删除',pkg.version,'trash');void scanCache(false);}});
    }
    function resetScenario(scenario='update') {
      taskGeneration++;cacheGeneration++;clearTimeout(cacheTimer);closeDialog();
      Object.assign(state,{scenario,phase:'available',current:CURRENT,disk:seedPackages(),cache:seedPackages(),cacheError:false,cacheScanning:false,progress:0,health:true,diagnosing:false,repairing:false,storageBusy:false,installDrive:'C',moveStatus:'unknown',networkChecked:false,checked:'刚刚',cacheSynced:'刚刚',activity:seedActivity()});
      if(scenario==='latest'){state.phase='latest';state.activity=[{icon:'check',title:'已是最新版本',detail:CURRENT,time:'刚刚'}];}
      if(scenario==='offline'){state.phase='error';state.activity=[{icon:'alert',title:'检查更新失败',detail:'连接超时，可重试',time:'刚刚'}];}
      if(scenario==='not-installed'){state.phase='not-installed';state.current=null;state.disk=[];state.cache=[];state.activity=[];}
      if(scenario==='resource')state.health=false;
      if(scenario==='cache-error'){state.cacheError=true;state.page='history';}
      if(scenario==='signature')state.phase='signature-error';
      if(scenario==='uac') {state.disk.unshift({id:'latest',version:LATEST,mb:436,date:'2026-11-10',pinned:false});state.cache=state.disk.map(pkg=>({...pkg}));state.phase='ready';}
      if(scenario!=='cache-error')state.page='overview';
      if(scenario==='move-blocked'){state.page='settings';state.tab='storage';state.moveStatus='blocked';}
      document.querySelector('#paused').hidden=true;render(true);document.querySelector('#main').scrollTop=0;
    }
    function setTheme(value) {
      preferences.theme=value;applyTheme();savePreferences();render();
      document.querySelector(`[data-theme-choice="${value}"]`)?.focus({preventScroll:true});
      toast(`已切换为${{light:'浅色',dark:'深色',system:'跟随系统'}[value]}`);
    }
    function pauseWindow(kind) {
      if(busy()&&kind==='close') {showDialog({title:'更新任务正在进行',body:'<p>请等待任务完成，或取消下载后再关闭窗口。</p>',confirm:'继续查看',symbol:'info'});return;}
      const el=document.querySelector('#paused');
      el.innerHTML=`<div class="logo">${icon('code')}</div><h2>${kind==='min'?'窗口已最小化':preferences.tray?'已收起到系统托盘':'更新器已关闭'}</h2><p>这是窗口行为演示，浏览器页面仍然打开。</p>${button('返回原型','restore-window','arrow','primary')}`;
      el.hidden=false;el.querySelector('button').focus();
    }
    async function copyDiagnostics() {
      const text=`Codex Updater 交互原型（示例数据）\n当前版本：${state.current||'未安装'}\n运行环境：${state.health?'正常':'资源缺失'}\n系统：Windows 11 x64\n缓存：${packageCount()} 个 / ${cacheSize()}`;
      try {await navigator.clipboard.writeText(text);toast('诊断信息已复制');}
      catch {showDialog({title:'诊断摘要',body:`<p>浏览器未允许剪贴板访问，可选中以下内容复制。</p><pre class="path" style="white-space:pre-wrap;user-select:text">${esc(text)}</pre>`,confirm:'完成',symbol:'copy'});}
    }
    const actions = {
      'check-move':()=>void checkMove(),'move-app':moveApp,'move-cache':moveCache,
      'app-location-help':()=>showDialog({title:'三个位置，分别管理',symbol:'disk',body:'<div class="detail-box"><p><strong>应用本体</strong><br>由 Windows 管理。支持时可迁移到其他应用卷，不能直接搬动 WindowsApps 文件夹。</p><p><strong>安装包缓存</strong><br>可以更改下载目录，或将已有安装包迁移到 D 盘。</p><p><strong>用户数据与项目</strong><br>配置、日志、会话和代码目录独立存在；迁移应用不代表这些文件全部迁移。</p></div><p style="margin-top:14px">实际支持情况须由桌面端检测。本原型不代表当前 Codex 包已通过迁移验证。</p>'}),
      'repair-info':()=>showDialog({title:'资源修复范围',symbol:'tool',body:'<p>重建 Codex 启动所需的 5 项运行资源副本，修复后自动复检。</p><div class="detail-box"><p>Windows 命令行与搜索工具</p><p>WSL 命令行与搜索工具</p><p>Node.js 运行时</p></div><p style="margin-top:14px">不重置用户配置。网络、账号登录和 Codex 自身缺陷需另行排查。</p>'}),
      overview:()=>navigate('overview'),diagnostics:()=>navigate('diagnostics'),
      check:()=>void checkUpdate(),download:()=>void download(),install:()=>requestInstall(),
      'cancel-download':()=>{taskGeneration++;state.phase=state.current?'available':'not-installed';state.progress=0;record('下载已取消','可重新下载','info');render();toast('下载已取消');},
      later:()=>{toast('安装包已保留，准备好后可随时安装');},
      launch:()=>toast('演示：Codex 已启动'),
      'scan-cache':()=>void scanCache(),
      'storage-settings':()=>navigate('settings','storage'),
      'auto-settings':()=>navigate('settings','general'),
      'clear-cache':clearCache,
      'external-delete':()=>{if(busy())return;state.disk=[];window.dispatchEvent(new Event('prototype-cache-change'));toast('已模拟磁盘文件删除，正在同步…');},
      'package-install':el=>requestInstall(state.disk.find(pkg=>pkg.id===el.dataset.id)),
      'delete-package':el=>deletePackage(state.disk.find(pkg=>pkg.id===el.dataset.id)),
      pin:el=>{if(busy())return;const pkg=state.disk.find(item=>item.id===el.dataset.id);if(!pkg)return;pkg.pinned=!pkg.pinned;state.cache=state.disk.map(item=>({...item}));render();toast(pkg.pinned?'已保留此版本，自动清理时会跳过':'已取消保留');},
      'open-directory':()=>showDialog({title:'下载目录',symbol:'folder',body:`<p>正式应用中会打开文件资源管理器。</p><div class="path mono" style="margin-top:15px">${esc(state.directory)}</div>`}),
      'change-directory':()=>showDialog({title:'更改下载目录',symbol:'folder',confirm:'使用演示目录',body:'<p>正式应用中会打开系统文件夹选择器。本次使用空的示例目录演示切换结果。</p><div class="path mono" style="margin-top:15px">D:\\CodexPackages</div><p style="margin-top:15px">旧目录文件不会迁移或删除，版本列表将重新读取新目录。</p>',action:()=>{state.directory='D:\\CodexPackages';state.disk=[];record('下载目录已更改','已切换到演示目录','folder');void scanCache(false);}}),
      diagnose:()=>void diagnose(),repair:()=>showDialog({title:'修复运行资源？',body:'<p>将重建 Windows / WSL 命令行与搜索工具、Node.js 的运行资源副本，完成后自动复检。</p><p style="margin-top:12px">正式执行前请保存工作，修复可能需要关闭 Codex；不会重置用户配置。原型不修改本机文件。</p>',confirm:'开始修复',symbol:'tool',action:()=>void diagnose(true)}),
      network:()=>{navigate('diagnostics');state.networkChecked=true;render();},
      'test-network':()=>{state.networkChecked=true;record('网络检测完成',state.scenario==='offline'?'连接超时':'连接正常（示例）','network');render();toast(state.scenario==='offline'?'连接失败，请检查网络后重试':'连接正常：Microsoft Store 可访问（示例）');},
      'launch-test':()=>showDialog({title:'测试 Codex 启动？',symbol:'play',confirm:'开始测试',body:'<p>正式应用会启动 Codex 并检查主窗口是否出现。</p>',action:()=>{record('启动测试完成','主窗口已显示（演示）','play');render();toast('启动测试通过（演示）');}}),
      'copy-diagnostics':()=>void copyDiagnostics(),
      'installed-info':()=>showDialog({title:'当前安装',symbol:'monitor',body:`<div class="detail-box"><p>Codex Desktop · <span class="mono">${state.current||'尚未安装'}</span></p><p>Windows 11 · x64</p><p>安装位置：${state.installDrive} 盘 · WindowsApps（示例）</p></div>`}),
      'install-info':()=>showDialog({title:'安装 Codex Desktop',symbol:'download',body:'<p>下载完成后校验安装包。点击安装并确认 Windows 管理员授权，完成后将自动启动 Codex。</p><div class="detail-box"><p>需要 Windows 10 / 11（以安装包要求为准）。</p><p>请确保有足够的磁盘空间。</p></div>'}),
      'signature-detail':()=>showDialog({title:'签名校验未通过',symbol:'shield',body:'<p>无法确认安装包的完整性或发布者，已阻止安装。</p><div class="detail-box"><p>重新下载后再试。如仍然失败，请将诊断信息交给技术支持。</p><p>本场景为模拟错误，切换至「发现更新」可演示成功流程。</p></div>'}),
      activity:()=>showDialog({title:'活动记录',symbol:'history',body:`<div class="timeline" style="padding:0">${state.activity.length?state.activity.map(eventMarkup).join(''):'<p>暂无活动。检查更新后会显示记录。</p>'}`,confirm:'关闭'}),
      help:()=>showDialog({title:'使用帮助',symbol:'help',body:'<div class="detail-box"><p><strong>更新 Codex</strong><br>概览 → 下载更新 → 安装并重启。</p><p><strong>清理与回退</strong><br>版本与缓存 → 清理、保留或回退版本。</p><p><strong>遇到问题</strong><br>诊断 → 检查环境 → 复制诊断信息给技术支持。</p></div><p style="margin-top:15px">Codex Updater 为非官方工具，与 OpenAI 无隶属关系。</p>'}),
      guide:()=>showDialog({title:'交互原型说明',symbol:'info',body:'<p>此原型用于内部评审，所有版本、进度、诊断与磁盘数据均为示例。</p><div class="detail-box"><p>① 设置 → 外观：试用浅色、深色与跟随系统。</p><p>② 版本与缓存 → 模拟外部删除缓存：观察数量、空间和列表同步。</p><p>③ 概览：体验下载、取消、校验、安装确认与完成状态。</p><p>④ 底部场景：查看网络失败、资源异常、签名失败和取消授权。</p></div><p style="margin-top:15px">主题及开关可在浏览器保存。真实磁盘监听、系统窗口控制、安装与授权需由桌面端接入。窗口最大化在原型中演示为浏览器全屏。</p>',confirm:'开始体验'}),
      reset:()=>{preferences={...defaults};savePreferences();applyTheme();state.directory='%LOCALAPPDATA%\\Codex Updater\\downloads';state.tab='general';resetScenario();toast('演示已重置');},
      dismiss:closeDialog,
      'confirm-dialog':()=>{const callback=dialogCallback;closeDialog();if(callback)callback();},
      'window-close':()=>pauseWindow('close'),'window-min':()=>pauseWindow('min'),
      'restore-window':()=>{document.querySelector('#paused').hidden=true;document.querySelector('[data-page="'+state.page+'"]').focus();},
      'window-max':async()=>{try {if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch {toast('浏览器不允许全屏，可使用 F11 预览');}}
    };
    document.addEventListener('click',event=>{
      const el=event.target.closest('button');if(!el||el.disabled)return;
      if(el.dataset.page){navigate(el.dataset.page);return;}
      if(el.dataset.tab){state.tab=el.dataset.tab;render();document.querySelector(`[data-tab="${state.tab}"]`)?.focus();if(state.tab==='storage')void scanCache(false);return;}
      if(el.dataset.themeChoice){setTheme(el.dataset.themeChoice);return;}
      if(el.dataset.toggle){const key=el.dataset.toggle;preferences[key]=!preferences[key];savePreferences();render();document.querySelector(`[data-toggle="${key}"]`)?.focus();toast('设置已更新');return;}
      if(actions[el.dataset.action])actions[el.dataset.action](el);
    });
    document.addEventListener('change',event=>{
      if(event.target.id==='scenario')resetScenario(event.target.value);
      if(event.target.id==='interval'||event.target.id==='retention'){preferences[event.target.id]=event.target.value;savePreferences();render();document.querySelector('#'+event.target.id)?.focus();toast('设置已更新');}
    });
    document.addEventListener('keydown',event=>{
      const theme=event.target.closest('[data-theme-choice]'),tab=event.target.closest('[data-tab]');
      if(!theme&&!tab)return;
      if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(event.key))return;
      event.preventDefault();
      const choices=theme?['light','dark','system']:['general','appearance','storage','about'];
      const current=theme?preferences.theme:state.tab;
      const index=event.key==='Home'?0:event.key==='End'?choices.length-1:(choices.indexOf(current)+(['ArrowRight','ArrowDown'].includes(event.key)?1:-1)+choices.length)%choices.length;
      if(theme)setTheme(choices[index]);else {state.tab=choices[index];render();document.querySelector(`[data-tab="${state.tab}"]`).focus();if(state.tab==='storage')void scanCache(false);}
    });
    document.querySelector('#modal').addEventListener('cancel',()=>{dialogCallback=null;});
    document.addEventListener('fullscreenchange',()=>{const el=document.querySelector('[data-action="window-max"]');el.setAttribute('aria-label',document.fullscreenElement?'还原窗口':'最大化');el.title=document.fullscreenElement?'还原窗口':'最大化';el.innerHTML=document.fullscreenElement?'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 3V1h7v7H9"/><rect x="1" y="4" width="7" height="7" rx=".5"/></svg>':'<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx=".7"/></svg>';});
    document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
    applyTheme();render(true);
  </script>
</body>
</html>
